name: Newnet API and Console Validation

on:
  pull_request:
    paths:
      - 'platform-api/**'
      - 'platform-admin/**'
      - '.github/workflows/newnet-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    name: API build and Newnet tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: platform-api
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/newnet_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies (no deployment or Docker hooks)
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Generate Prisma client (without database connection)
        run: npx prisma generate
      - name: Run document and billing tests
        run: npm run test:newnet
      - name: Compile Nest API
        run: npm run build

  admin:
    name: Console Vite build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITLAB_PACKAGE_TOKEN: ${{ secrets.GITLAB_PACKAGE_TOKEN }}
    defaults:
      run:
        working-directory: platform-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify access to private Studio UX registry
        run: |
          if [ -z "$GITLAB_PACKAGE_TOKEN" ]; then
            echo "::error::Configure the GitHub Actions secret GITLAB_PACKAGE_TOKEN with a read_package_registry token for git.nivoo.dev.br."
            exit 1
          fi
      - name: Install frontend dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Compile console
        run: npm run build
